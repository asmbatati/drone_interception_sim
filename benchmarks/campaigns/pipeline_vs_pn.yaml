# Benchmark campaign: pluggable-pipeline backends, the BT head and the PN
# baseline on the same two-drone scene. Run with scripts/run_benchmark.py.
partition: ihunter        # GZ_PARTITION of the managed sim
domain: 21                # ROS_DOMAIN_ID of the managed sim
trials: 10                # per (method, scenario)
seed: 1                   # phase-delay RNG
timeout: 120              # metrics timeout, s (no capture -> 'timeout' row)
sim_ready_timeout: 60     # s; good starts are ready in ~20 s, a stuck one is restarted
phase_period: 15.7        # random start delay range, s (one target lap: 2*pi/0.4)
px4_params:               # interceptor only, set once the sim is up
  RTL_RETURN_ALT: 8.0     # default 30 m: the climb dominated the time between trials
  RTL_DESCEND_ALT: 4.0
sim_args:
  headless: 1
  use_rviz: 'false'
scenarios:
  circle: {}                                   # config/target_trajectory.yaml: r 6 m, 0.4 rad/s (2.4 m/s)
  evade: {target_evade: 'true'}                # + reactive evasion within 6 m
methods:
  # Pluggable pipeline under the FSM head (AUTO.TAKEOFF, then OFFBOARD cascade)
  - name: pipeline/rendezvous+gru+passthrough+px4_setpoint
    launch: [drone_interception_sim, pipeline.launch.py,
             {orchestrator: fsm, planner: rendezvous, predictor: gru, viz: 'false'}]
    metrics_in_launch: true
  - name: pipeline/rendezvous+const_vel+passthrough+px4_setpoint
    launch: [drone_interception_sim, pipeline.launch.py,
             {orchestrator: fsm, planner: rendezvous, predictor: const_vel, viz: 'false'}]
    metrics_in_launch: true
  - name: pipeline/tail_chase+gru+passthrough+px4_setpoint
    launch: [drone_interception_sim, pipeline.launch.py,
             {orchestrator: fsm, planner: tail_chase, predictor: gru, viz: 'false'}]
    metrics_in_launch: true
  - name: pipeline/rendezvous+gru+mpc_12state+px4_setpoint
    launch: [drone_interception_sim, pipeline.launch.py,
             {orchestrator: fsm, planner: rendezvous, predictor: gru, mpc: mpc_12state,
              viz: 'false'}]                    # control_lookahead defaults to 1.0 s here
    metrics_in_launch: true
  - name: pipeline/rendezvous+gru+passthrough+se3
    launch: [drone_interception_sim, pipeline.launch.py,
             {orchestrator: fsm, planner: rendezvous, predictor: gru, controller: se3,
              viz: 'false'}]
    metrics_in_launch: true
  # Behaviour Tree head (d2dtracker_states) flying from the planner's intercept point
  - name: bt/rendezvous+gru
    launch: [drone_interception_sim, pipeline.launch.py,
             {orchestrator: bt, planner: rendezvous, predictor: gru, viz: 'false'}]
    metrics_in_launch: true
  # Guidance-law baselines (d2dtracker_interception guidance node)
  - name: pn
    launch: [d2dtracker_interception, guidance.launch.py, {law: pn}]
  - name: pursuit
    launch: [d2dtracker_interception, guidance.launch.py, {law: pursuit}]
  - name: pn_int
    launch: [d2dtracker_interception, guidance.launch.py, {law: pn_int}]   # textbook PN, 6 m/s
  # RL: the curriculum's evasive-stage SAC policy, trained in AeroGym at 0.5 m/s
  - name: rl/model_evasive_40k
    launch: [drone_interception_sim, pipeline.launch.py,
             {orchestrator: rl, viz: 'false',
              rl_model: ~/drone_interception_ws/ros2_ws/src/d2dtracker_rl/checkpoints/intercept/model_evasive_40k.zip}]
    metrics_in_launch: true
